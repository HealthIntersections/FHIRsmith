name: PR Pipeline

on:
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for changed files detection

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint changed files only
        run: |
          # Get changed JS files, excluding vendor directories
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRT origin/main...HEAD | grep -E '\.(js|mjs)$' | grep -v 'static/' | grep -v 'node_modules/' | tr '\n' ' ')
          if [ -n "$CHANGED_FILES" ]; then
            echo "Linting changed files: $CHANGED_FILES"
            npx eslint $CHANGED_FILES
          else
            echo "No relevant JavaScript files changed"
          fi

      - name: Check code formatting
        run: |
          # Optional: Check if code is properly formatted
          # npx prettier --check "**/*.{js,json,md}" --ignore-path .gitignore

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        # Everything, dev tooling included. These all have fixes at the time of writing, so fail on
        # high/critical; moderate and low are reported here but don't fail the build
        run: npm audit --audit-level=high

      - name: Check what ships for known vulnerabilities
        # What the Docker image gets (it is built with npm ci --omit=dev): fail on anything moderate or worse
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit a fresh install of the published package
        # npm ignores package.json "overrides" when FHIRsmith is installed (npm install -g fhirsmith)
        # rather than cloned, and the published package has no lock file. So the repo's own audit can
        # be clean while installed servers get vulnerable transitive versions. This installs the
        # package the way users do, into an empty folder, and audits what that actually gets
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/fresh-install"
          cd "$RUNNER_TEMP/fresh-install"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/fhirsmith-*.tgz
          npm audit --omit=dev --audit-level=moderate

  dependency-check:
    name: Dependency Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for outdated dependencies
        run: |
          npm outdated || true  # Don't fail, just report

      - name: Check package.json changes
        run: |
          if git diff --name-only origin/main...HEAD | grep -q "package.json\|package-lock.json"; then
            echo "Dependencies changed - review required"
            git diff origin/main...HEAD -- package.json package-lock.json
          fi