name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # A PR whose tests need changes to the tx-ecosystem IG is tested against the tx-ecosystem PR
      # that makes them: if HL7/fhir-tx-ecosystem-ig has an open PR from a branch with the same
      # name as this one, and there is a CI build of that branch, the terminology tests come from
      # it (FHIRSMITH_TX_TESTS_VERSION=current$<branch>; see tx/tests/tx-tests-package.js).
      # Otherwise, and for every build that isn't a PR, from the CI build of main. The
      # tx-ecosystem branch has to be built before this runs: if it isn't yet, run this again.
      # Branch names with a / in them aren't supported
      - name: Choose the tx-ecosystem build to test against
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "Branch '$BRANCH' can't be matched to a tx-ecosystem branch: the tests come from the build of main"
            exit 0
          fi
          open=$(gh api --paginate "repos/HL7/fhir-tx-ecosystem-ig/pulls?state=open&per_page=100" --jq ".[] | select(.head.ref == \"$BRANCH\") | .number")
          if [ -z "$open" ]; then
            echo "No open tx-ecosystem PR from a branch '$BRANCH': the tests come from the build of main"
            exit 0
          fi
          url="https://build.fhir.org/ig/HL7/fhir-tx-ecosystem-ig/branches/$BRANCH/package.tgz"
          if ! curl -sfIL -o /dev/null "$url"; then
            echo "::warning::tx-ecosystem PR #$open is open from '$BRANCH', but there is no CI build of it yet ($url): the tests come from the build of main. Run this again once it is built"
            exit 0
          fi
          echo "The tests come from tx-ecosystem PR #$open, branch '$BRANCH'"
          echo "FHIRSMITH_TX_TESTS_VERSION=current\$$BRANCH" >> "$GITHUB_ENV"

      # The terminology files the tx tests load (tx/fixtures/*.yml: about 1.7 GB of SNOMED CT and
      # LOINC) are downloaded into data/terminology-cache when a test first needs them. Kept between
      # runs, so the test step doesn't wait on the download; a changed file list starts from the
      # last cache and downloads only what is new
      - name: Cache terminology test files
        uses: actions/cache@v4
        with:
          path: data/terminology-cache
          key: tx-test-files-${{ hashFiles('tx/fixtures/*.yml') }}
          restore-keys: tx-test-files-

      - name: Run tests
        run: npm run test:ci
        timeout-minutes: 45
        env:
          SUPPRESS_LOGS: 'true'
          NODE_OPTIONS: "--max-old-space-size=14000"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./test-results/junit.xml

      # With SUPPRESS_LOGS, what the server logged during the tests is only in the log files
      - name: Upload server logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: server-logs
          path: ./data/logs/
          if-no-files-found: ignore
