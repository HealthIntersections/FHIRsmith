# Each source is type[!]:details[=prefix] - see tx/README.md.
#
# The prefix (after the last '=') is the id space for the resources the source provides:
# with npm:hl7.terminology=tho, THO's v3-ActCode is CodeSystem/tho-v3-ActCode. Every
# resource is served with a prefixed id - never the id it has in its source, which other
# sources may share - and each endpoint's own FHIR core package uses 'core'. A source with
# no prefix gets a number, which changes when sources are added, removed or reordered, so
# any source whose resources people link to by id should have one.
